name: "failfirst: verified PR tests"
description: "Writes a Playwright test for a PR's UI change and posts it only if it passes on the PR build and fails on the base build."
branding:
  icon: check-circle
  color: green

inputs:
  gemini-api-key:
    description: Gemini API key (pass secrets.GEMINI_API_KEY). Empty -> the run is skipped with a note.
    required: false
    default: ""
  github-token:
    description: Token used to post the PR comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}
  post-comment:
    description: "'true' posts/updates the PR comment. Anything else renders it and writes the planned request only (dry run)."
    required: false
    default: "true"
  install-command:
    description: Installs the app's dependencies (run in the repo root, and in a base worktree if its lockfile differs).
    required: false
    default: npm ci --no-audit --no-fund
  build-command:
    description: Builds the app for production.
    required: false
    default: npm run build
  serve-command:
    description: Serves the built app. Must contain {port}.
    required: false
    default: npm run preview -- --port {port} --strictPort --host 127.0.0.1
  python-version:
    description: Python used to run the generator.
    required: false
    default: "3.11"

outputs:
  status:
    description: verified | unverified | no_test_needed | error | skipped
    value: ${{ steps.run.outputs.status || 'skipped' }}

runs:
  using: composite
  steps:
    # 1. Decide before any PR code runs. Fork PRs stop here (no secrets, read-only token).
    - name: Gate
      id: gate
      shell: bash
      env:
        FAILFIRST_HAS_KEY: ${{ inputs.gemini-api-key != '' }}
      run: python3 "$GITHUB_ACTION_PATH/action/gate.py" --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"

    - name: Set up Python
      if: steps.gate.outputs.skip == 'false'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Caches are restored and saved explicitly, and saved BEFORE any PR code runs
    # (install scripts, build), so a PR cannot plant anything in them. Keys are
    # computed in shell because hashFiles() only sees the workspace, and this
    # action's own files live outside it.
    - name: Cache keys
      id: keys
      if: steps.gate.outputs.skip == 'false'
      shell: bash
      run: |
        echo "req=$(sha256sum "$GITHUB_ACTION_PATH/requirements.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
        echo "pip-dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

    - name: Restore pip cache
      id: pip-cache
      if: steps.gate.outputs.skip == 'false'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.pip-dir }}
        key: failfirst-pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ steps.keys.outputs.req }}

    - name: Install generator
      id: generator
      if: steps.gate.outputs.skip == 'false'
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -q -r "$GITHUB_ACTION_PATH/requirements.txt"
        echo "playwright=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

    - name: Save pip cache
      if: steps.gate.outputs.skip == 'false' && steps.pip-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.keys.outputs.pip-dir }}
        key: ${{ steps.pip-cache.outputs.cache-primary-key }}

    - name: Restore Chromium cache
      id: browser-cache
      if: steps.gate.outputs.skip == 'false'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: failfirst-chromium-${{ runner.os }}-playwright${{ steps.generator.outputs.playwright }}

    - name: Install Chromium
      if: steps.gate.outputs.skip == 'false'
      shell: bash
      env:
        FAILFIRST_BROWSER_CACHED: ${{ steps.browser-cache.outputs.cache-hit }}
      run: |
        if [ "$FAILFIRST_BROWSER_CACHED" = "true" ]; then
          # Browser restored from cache; its system packages still have to be installed.
          python -m playwright install-deps chromium
        else
          python -m playwright install --with-deps chromium
        fi

    - name: Save Chromium cache
      if: steps.gate.outputs.skip == 'false' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}

    # 2. PR code starts running here (install scripts, build). No secrets in this step's env.
    - name: Install app dependencies
      if: steps.gate.outputs.skip == 'false'
      shell: bash
      env:
        FAILFIRST_INSTALL_CMD: ${{ inputs.install-command }}
      run: $FAILFIRST_INSTALL_CMD

    # 3. Classify -> build PR + base -> generate -> verify. PR title/body come from the
    #    event file inside Python, never interpolated into shell.
    - name: Generate and verify test
      id: run
      if: steps.gate.outputs.skip == 'false'
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        FAILFIRST_INSTALL_CMD: ${{ inputs.install-command }}
        FAILFIRST_BUILD_CMD: ${{ inputs.build-command }}
        FAILFIRST_SERVE_CMD: ${{ inputs.serve-command }}
        FAILFIRST_OUT: ${{ runner.temp }}/failfirst
      run: |
        set +e
        python "$GITHUB_ACTION_PATH/action/cli.py" run \
          --repo "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" --out-dir "$FAILFIRST_OUT" \
          --install-cmd "$FAILFIRST_INSTALL_CMD" --build-cmd "$FAILFIRST_BUILD_CMD" --serve-cmd "$FAILFIRST_SERVE_CMD"
        code=$?
        if [ -f "$FAILFIRST_OUT/result.json" ]; then
          status=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$FAILFIRST_OUT/result.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$FAILFIRST_OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $code

    # 4a. Post (or update) the PR comment. Only VERIFIED results carry test code.
    - name: Post PR comment
      if: always() && steps.gate.outputs.skip == 'false' && inputs.post-comment == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FAILFIRST_OUT: ${{ runner.temp }}/failfirst
        FAILFIRST_PR: ${{ github.event.pull_request.number }}
      run: |
        [ -f "$FAILFIRST_OUT/result.json" ] || { echo "no result to post"; exit 0; }
        python "$GITHUB_ACTION_PATH/action/cli.py" post \
          --result "$FAILFIRST_OUT/result.json" --repo "$GITHUB_REPOSITORY" --pr "$FAILFIRST_PR" --post

    # 4b. Dry run: render the comment and write the request that would have been sent.
    - name: Render PR comment (dry run, nothing sent)
      if: always() && steps.gate.outputs.skip == 'false' && inputs.post-comment != 'true'
      shell: bash
      env:
        FAILFIRST_OUT: ${{ runner.temp }}/failfirst
        FAILFIRST_PR: ${{ github.event.pull_request.number }}
      run: |
        [ -f "$FAILFIRST_OUT/result.json" ] || { echo "no result to render"; exit 0; }
        python "$GITHUB_ACTION_PATH/action/cli.py" post \
          --result "$FAILFIRST_OUT/result.json" --repo "$GITHUB_REPOSITORY" --pr "$FAILFIRST_PR"

    - name: Upload run evidence
      if: always() && steps.gate.outputs.skip == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: failfirst-${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/failfirst
        if-no-files-found: ignore
